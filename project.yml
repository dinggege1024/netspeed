name: NetSpeed
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
settings:
  base:
    # Set your Apple Team ID in Xcode (Signing & Capabilities), or:
    # DEVELOPMENT_TEAM: YOUR_TEAM_ID
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  NetSpeed:
    type: application
    platform: iOS
    sources:
      - path: NetSpeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.netspeed
        PRODUCT_NAME: 网速
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 网速
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: NetSpeedWidgets
        embed: true
    entitlements:
      path: NetSpeed/NetSpeed.entitlements

  NetSpeedWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: NetSpeedWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.netspeed.widgets
        PRODUCT_NAME: NetSpeedWidgets
        INFOPLIST_FILE: NetSpeedWidgets/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: false
schemes:
  NetSpeed:
    build:
      targets:
        NetSpeed: all
        NetSpeedWidgets: all
    run:
      config: Debug
